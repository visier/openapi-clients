theme:
  openapi:
    hideHostname: true
    disableSearch: true
    showObjectSchemaExamples: true
    schemaDefinitionsTagName: 'Schemas'
    pathInMiddlePanel: true
    generatedSamplesMaxDepth: 30
    theme:
      components:
        httpBadges: 
          color: '#000000'
          borderRadius: '16px'
      colors:
        http:
          get: '#0e861f'
          put: '#0c4e99'
          delete: '#992929'
          post: '#ca7900'
          patch: '#2f106c'
        text:
          light: '#0f0f0e'
        primary:
          main: '#f1481d'
        responses:
          success: 
            color: '#63c670'
          error:
            color: '#ff4444'
      layout:
        showDarkRightPanel: false
      sidebar:
        backgroundColor: '#fbf8f4'
        activeTextColor: '#f1481d'
        spacing:
          unit: 0
          paddingVertical: '0px'
          paddingHorizontal: '0px'
          offsetTop: '0px'
          offsetNesting: '0px'
          offsetLeft: '0px'
        width: '20%'
      rightPanel: 
        backgroundColor: '#fbf8f4'
        textColor: '#0f0f0e'
      codeBlock: 
        backgroundColor: '#313130'
      typography:
        fontFamily: 'inherit'
        fontSize: 'inherit'
        headings:
          fontFamily: 'inherit'
        code: 
          color: '#0f0f0e'
          fontSize: 'inherit'
          wrap: true
